name: development

on:
  push:
    branches:
      - master
      - ci
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  clang-format-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          brew update
          brew install clang-format
      - name: Run clang-format
        run: cd ${GITHUB_WORKSPACE}/ci && sh ./lint.sh && cd ${GITHUB_WORKSPACE}
      - name: Check for changes
        run: |
          if ! git diff --ignore-space-at-eol --exit-code; then
            exit 1
          fi

  linux-build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          aqtversion: '==3.3.*'
          version: '5.15.2'
          host: 'linux'
          target: 'desktop'
          archives: 'qttools qtsvg qtimageformats qtbase qtmultimedia icu'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev libgl1-mesa-dev libfuse2 libfontconfig1 xvfb
      - name: Build application
        run: |
          qmake
          make -j`nproc`
      - name: Build and run unit tests
        run: |
          cd tests
          qmake
          make -j`nproc`
          ./autoremesher_tests
          cd ..
      - name: Run headless smoke test (Organic)
        run: |
          xvfb-run ./autoremesher --input tests/cube.obj --output /tmp/cube_organic.obj --target-quads 50 --report /tmp/report.txt
          cat /tmp/report.txt
          test -s /tmp/cube_organic.obj
      - name: Run headless smoke test (Hard Surface)
        run: |
          xvfb-run ./autoremesher --input tests/cube.obj --output /tmp/cube_hardsurface.obj --target-quads 50 --model-type hardsurface
          test -s /tmp/cube_hardsurface.obj